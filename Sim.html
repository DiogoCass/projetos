<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Conexão com App Script</title>
</head>
<body style="font-family:Arial; padding:40px;">
  <h2>🔗 Teste de Conexão com o Google App Script</h2>
  <button id="btnTestar">Testar Conexão</button>
  <pre id="output" style="margin-top:20px; background:#f5f5f5; padding:15px; border-radius:8px;"></pre>

  <script>
    const APPS_SCRIPT_BASE = "https://script.google.com/macros/s/AKfycbyShsQ0FZ9PXYYUgUJRU3qQZXJoXpZ1l4T6PpyCU5Zns7AFvqOvi_YUpk3Nub63RRuGBQ/exec";

    async function serverRequest(payload){
      try {
        const res = await fetch(APPS_SCRIPT_BASE, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        return data;
      } catch (err) {
        throw new Error('Erro ao conectar: ' + err.message);
      }
    }

    document.getElementById('btnTestar').addEventListener('click', async () => {
      const output = document.getElementById('output');
      output.textContent = "⏳ Testando conexão...";
      try {
        const resp = await serverRequest({
          action: "logAction",
          actionType: "testeConexao",
          ownerId: "debugUser",
          details: "Teste direto do botão"
        });
        output.textContent = "✅ Conectado!\n\n" + JSON.stringify(resp, null, 2);
      } catch (e) {
        output.textContent = "❌ Erro: " + e.message;
      }
    });
  </script>
</body>
</html>
