<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Shashikant">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Pagina De Compra</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');


* {

    margin: 0;

    padding: 0;

    font-family: poppins;

    cursor: default;

}


body {

    height: 100vh;

    box-sizing: border-box;

    display: flex;

    align-items: center;

    justify-content: center;

    background-image: url("https://i.ibb.co/SN2RbLG/background.jpg");

    background-size: cover;

    background-repeat: no-repeat;

    padding-top: 50px;

}


.ccontainer {

    position: relative;

    display: flex;

    flex-direction: column;

    width: 300px;

    height: max-content;

    border: 3px solid #ffffff;

    background-color: #fff;

    border-radius: 10px;

    border-top-left-radius: 0px;

    padding: 10px 20px;

    gap: 10px;

    box-sizing: border-box;

}


.pprice {

    display: flex;

    align-items: center;

    flex-direction: row;

    gap: 5px;

}


.mmrp {

    text-decoration: line-through;

    color: #a7a7a7;

    font-size: 14px;

}


.ssp {

    font-size: 20px;

    font-weight: 600;

}


.ddescription {

    font-size: 14px;

    color: #393939;

}


.ccolor_varient {

    display: flex;

    gap: 10px;

}


.ccircle {

    height: 20px;

    width: 20px;

    border-radius: 50%;

    cursor: pointer;

    box-sizing: border-box;

}


.nneutral {

    background-color: #b9b3a9;

}


.bblue {

    background-color: #484f5e;

}


.wwhite {

    background-color: #f1f0eb;

}


.ccircle:hover {

    border: 2px solid #000000;

}


.bblack {

    background-color: #515254;

}


.bbtn {

    border: 3px solid #FF4D00;

    background-color: transparent;

    cursor: pointer;

    color: #FF4D00;

    border-radius: 200px;

    transition: all 0.3s linear;

    position: relative;

    overflow: hidden;

    width: 100%;

    height: 45px;

    white-space: nowrap;

    outline: none;

    align-self: center;

    z-index: 1;

    display: flex;

    justify-content: center;

    align-items: center;

    font-weight: 600;

    box-sizing: border-box;

}


.bbtn::before {

    content: "";

    position: absolute;

    left: -100%;

    top: 0;

    width: 100%;

    height: 100%;

    background-color: #FF4D00;

    border-radius: 200px;

    z-index: -1;

    transition: all 0.3s linear;

}


.bbtn:hover {

    color: #fff;

}


.bbtn:hover::before {

    left: 0;

}


.bbuynow {

    background-color: #FF4D00;

    color: #fff;

    margin-top: 10px;

    transition: all 0.2s linear;

}


.bbuynow::before {

    content: none;

}


.bbuynow:hover {

    background-color: #ff560e;

    box-shadow: 0px 0px 10px #FF4D00;

}


.sspecial_deal {

    position: absolute;

    top: -25px;

    left: -3px;

    background-color: #FF4D00;

    color: #fff;

    padding: 1px 5px;

    border-radius: 0px;

    font-size: 13px;

    z-index: 1;

    overflow: hidden;

    border-radius: 5px 5px 0px 0px;

}


.sspecial_deal::before {

    content: "";

    width: 100%;

    height: 100%;

    position: absolute;

    background-image: linear-gradient(to right, rgba(0, 0, 0, 0), #ff9b70, rgba(0, 0, 0, 0));

    left: -100%;

    top: 0;

    z-index: -1;

    animation: special_animation 1s ease-in-out infinite;

}


@keyframes special_animation {

    from {

        left: -100%;

    }


    to {

        left: 100%;

    }

}


.aaddtocart i {

    color: #ffffff;

    font-size: 13px;

}


.ii_wrapper {

    position: absolute;

    left: 0;

    background-color: #FF4D00;

    height: 45px;

    width: 60px;

    border-radius: 45px;

    display: flex;

    justify-content: center;

    align-items: center;

}


.iimg {

    background-image: url("https://www.evolvesuplementos.com.br/storage/images/cache/creatina-monohidratada-produto-1729096825-730-60854642.webp");

    height: 220px;

    width: 100%;

    background-size: cover;

    background-position: center;
    scale: 1.3;
    position: relative;
    top:-40px;

}


@media (max-height:638px) {

    .iimg {

        height: 150px;

    }

}
    </style>
</head>

<body>
    <main>
        <div class="ccontainer">
            <div class="sspecial_deal">
                Promoção especialo
            </div>
            <div class="iimg"></div>
            <div class="ccolor_varient">
                <div class="ccircle bblack"></div>
                <div class="ccircle bblue"></div>
                <div class="ccircle wwhite"></div>
                <div class="ccircle nneutral"></div>
            </div>
            <h2 class="iiphone">
                CREATINA EVOLVE
            </h2>
            <div class="pprice">
                <div class="iiphone ssp">$90,00</div>
                <div class="iiphone mmrp">$114,00</div>
            </div>
            <p class="ddescription iiphone">
                ou em 3x de R$ 46,63 sem juros.
            </p>
            <div class="bbuynow iiphone bbtn" onclick="window.location.href=`https://wa.me/+555196748252?text=Olá%20Diogo,%20eu%20queria%20comprar%20uma%20creatina%20da%20evolve%20contigo`">
                Comprar agora
            </div>
            <div class="aaddtocart iiphone bbtn" onclick="alert('Produto Salvo')">
                <div class="ii_wrapper">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <span> Guardar </span>
            </div>
        </div>
    </main>
</body>
</html>
