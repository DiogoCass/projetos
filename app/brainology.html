
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainology - MVP</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
<style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap");
@import url("https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap");
* {
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
 }
.landinnng {
  padding-top: 2em;
  font-family: 'Cabin', sans-serif;
  display: block;
  color: white;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: rgb(50 50 90);
  background-size: cover;
  background-position: center center;
}
@media (min-width: 768px) {
  .landinnng {
    background: url("./landing.png");
  }
}
.landinnng .headinnng {
  position: fixed;
  top: 30%;
  left: 50%;
  -webkit-transform: translate(-50%, -50%);
          transform: translate(-50%, -50%);
  font-weight: bolder;
  font-size: 2.5em;
  text-align: right;
  line-height: 1.25em;
  font-family: "Cinzel";
}
@media (min-width: 768px) {
  .landinnng .headinnng {
    font-size: 4.5em;
  }
}
.landinnng .nexxxt {
  position: absolute;
  bottom: 10%;
  left: 50%;
  -webkit-transform: translate(-50%, -50%);
          transform: translate(-50%, -50%);
  background: rgba(255, 255, 255, 0.2);
  padding: 1.4em 2.4em 1.4em 4.4em;
  -webkit-backdrop-filter: blur(10px);
          backdrop-filter: blur(10px);
  border-radius: 1em;
  -webkit-user-select: none;
     -moz-user-select: none;
      -ms-user-select: none;
          user-select: none;
  font-family: "Poppins", cursive;
  text-transform: bolder;
  font-weight: 900; 
  font-size: 9.5pt;
}
.landinnng .nexxxt p {
    width: 118px;
}
.landinnng .nexxxt .swippeeer {
  position: absolute;
  content: '';
  width: 2.5em;
  height: 100%;
  background: #fff;
  left: 0;
  color: #333;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-pack: center;
      -ms-flex-pack: center;
          justify-content: center;
  -webkit-box-align: center;
      -ms-flex-align: center;
          align-items: center;
  top: 0;
  font-size: 1.25em;
  font-weight: bolder;
  border-radius: 1em;
}
.landinnng.hiddde {
  display: none;
}
.headeeer {
  position: fixed;
  color: white;
  top: 0;
  font-family: 'Roboto', sans-serif;
  font-weight: 800;
  font-size: 2.5em;
  z-index: 1;
  width: 100%;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-pack: justify;
      -ms-flex-pack: justify;
          justify-content: space-between;
  padding: 0.75em;
}
.hommme {
  width: 100vw;
  height: 100vh;
  background-color: rgb(50 50 90);
}
.hommme.hiddde {
  display: none;
}
iframe {
    border: none;
    height: 100dvh;
    width: 100vw;
    position: absolute;
}
</style>
</head>

<body onload="runScript()">
    <div id="landinnng" class="landinnng">
        <div class="headinnng">
            <h1>Brain</h1>
            <h4>Nology</h4>
        </div>

        
        <div class="nexxxt">
            <i class="ri-arrow-right-line swippeeer"></i>
            <p>Arrasta pro lado :)</p>
        </div>
        
     </div>
    
<div class="hommme hiddde" id="hommme">
    
    <iframe border="none" src="https://wordgame2.netlify.app" allowfullscreen></iframe>
    
</div>

<script>
function runScript() {
    swipperFunction();
}

function showSection(className) {
    document.querySelector('.' + className).classList.remove('hiddde');
}

function hideSection(className) {
    document.querySelector('.' + className).classList.add('hiddde');
}

function swipperFunction() {
    let mouseOrigin;
    let isSwiping = false;
    let swipeMargin = 10;
    let swipper = document.querySelector('.swippeeer');
    swipper.addEventListener('mousedown', startSwipe);
    swipper.addEventListener('touchstart', (event) => { startSwipe(event, true) });
    swipper.addEventListener('mouseup', endSwipe);
    swipper.addEventListener('touchend', endSwipe);
    swipper.addEventListener('mousemove', detectMouse);
    swipper.addEventListener('touchmove', (event) => { detectMouse(event, true) });

    function startSwipe(evnt, mobile = false) {
        mouseOrigin = !mobile ? evnt.screenX : evnt.touches[0].screenX;
        isSwiping = true;
    }

    //ENDSWIPE
    function endSwipe() {
        mouseOrigin = null;
        isSwiping = false;
        swipper.style.margin = 0;

    }
    //DETECTMOUSE
    function detectMouse(evnt, mobile = false) {
        let currentMousePosition = !mobile ? evnt.screenX : evnt.touches[0].screenX;
        let swipeDifference = Math.abs(mouseOrigin - currentMousePosition)
        if (isSwiping && (swipeDifference > swipeMargin)) {
            if ((swipeDifference - swipeMargin) <= swipeMargin) {
                //no change, allows user to take no action
                swipper.style.margin = 0;
            } else if ((mouseOrigin < currentMousePosition)) {
                //swip right");
                if (swipeDifference >= 164) {
                    endSwipe();
                    hideSection('landinnng')
                    showSection('hommme');
                    return;
                }
                swipper.style.marginLeft = swipeDifference + "px";
            }
        }
    }
}
</script>
</body>
</html>
