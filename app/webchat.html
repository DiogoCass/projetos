    <script>
//-------- Menu Toggle -------- //
const $ = id => document.getElementById(id);
var check = true;
function dg_trocar(){

        tema.style.color ="white";
        check = !check;
    } else {
        body.style.background ="rgb(50 50 90)";
        amarelo.style.background ="#d19f15";
        azul.style.background ="#6c0296";
        verde.style.background ="#2269ab";
        tema.style.background ="white";
        tema.style.color ="rgb(40 40 100)";
        tema.innerHTML ="Escuro";
        check = !check;
    }
}
//-------- Displayer Of Contents -------- //
let prv, nxt, title, content, count, current=1;
let pages = {
  1:{t:"Brainology Chat", c:"Conversas"},
  2:{t:"Brainology Chat",}
};
count = Object.keys(pages).length;
window.onload = init;
function init(){
   var c = document.getElementById("messages");

  prv = document.querySelector("#dgcss-prev");
  nxt = document.querySelector("#dgcss-next");
  title = document.querySelector("#dgcss-title");
  cont = document.querySelector("#content");
  prv.addEventListener("click", volta);
  nxt.addEventListener("click", nextPage);
  setCurrent(current);
}
function setCurrent(current){
  title.textContent = pages[current].t;
  //cont.innerHTML = pages[current].c;
  prv.disabled = current<=1?true:false; 
  nxt.disabled = current>=count?true:false;
}
        /*
function prevPage(){
  current = current<=1?1:--current;
  setCurrent(current);
}
*/
function nextPage(){
  current = current>=count?count:++current; 
  setCurrent(current);
}

module = {};
</script>

    <body id="body">

    <script type="module">
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, set, remove, onChildAdded, onChildRemoved } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJ81pHD2-xnKczsJyrWwIZao-rypkeDOo",
            authDomain: "coder-8ddcf.firebaseapp.com",
            projectId: "coder-8ddcf",
            storageBucket: "coder-8ddcf.appspot.com",
            messagingSenderId: "603139974872",
            appId: "1:603139974872:web:98026f933d6f421116d9ad"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // variables
        var msgTxt = document.getElementById('msgTxt');
        var sender;
        if(sessionStorage.getItem('sender')){
            sender = sessionStorage.getItem('sender');
        } else {
            sender = prompt('Por Favor, Insira Seu Nome');
            sessionStorage.setItem('sender',sender);
        }

        // TO SEND MESSAGES
        module.sendMsg = function sendMsg(){
            var msg = msgTxt.value;
            var timestamp = new Date().getTime();
            set(ref(db,"messages/"+timestamp),{
                msg : msg,
                sender : sender
            })

            msgTxt.value="";
        }

        // TO RECEIVE MSG
        onChildAdded(ref(db,"messages"), (data)=>{
            if(data.val().sender == sender){
                messages.innerHTML += "<div style=justify-content:end class=outer id="+data.key+"><div id=inner class=me> Você: "+data.val().msg+" <button id=dltMsg onclick=module.dltMsg("+data.key+")>❎ Apagar? </button></div></div>";
            } else {
                messages.innerHTML += "<div class=outer id="+data.key+"><div id=inner class=notMe><div id=oi></div>"+data.val().sender+": "+data.val().msg+"</div></div>";
            }
        })

        // TO DELETE MSG
        module.dltMsg = function dltMsg(key){
            remove(ref(db,"messages/"+key));
        }

        // WHEN MSG IS DELETED
        onChildRemoved(ref(db,"messages"),(data)=>{
            var msgBox = document.getElementById(data.key);
            messages.removeChild(msgBox);
        })
    </script>
