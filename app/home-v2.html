<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title> Brainology - MVP </title>
        <meta name="author" content="@dgcass">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap");
@import url("https://fonts.googleapis.com/css2?family=Dongle:wght@700&display=swap");
body {
    margin: 0;
    padding: 0;
    font-family: Poppins;
    background: rgb(50 50 90); #FF55A3;
    transition: 0.3s;
    z-index: -5;
}
#tema {
    background: white;
    color: rgb(40 40 100);
}
.dgcss-menu {
    width: 100%;
    background: rgba(240, 240, 255, 0.4);
    position: absolute;
    left: 0px;
    top: 0px;
    color: white;
    z-index: 3;
    display: flex;
    gap: 50px;
    text-align: center;
    justify-content: space-around;
}
.dgcss-menu div button {
    padding: 6px;
    background: transparent;
    border: 1px solid white;
    margin: 17px 0px 0px 35px;
    color: white;
    font-family: Poppins;
}
button:hover {
    transform: scale(1.05);
}
button {
    transition: 0.3s;
    border-radius:3px;
}
.dgcss-bolhas {
    width: 100vw;
    height: 100vh;
    position: fixed;
}
.dgcss-bolhas > * {
    width: 200px; height: 100px;
    position: absolute;
    animation: scala 5s ease-in-out infinite;
}
@keyframes scala {
    50%{ transform: scale(2); }
}
#dgcss-cor-azul {
    background: #6c0296; blue;
    top: 90%;
    height: 10vh;
    transition: 0.3s;
    animation-delay: 1s;
}
#dgcss-cor-verde {
    background: #2269ab; #52fe99;
    width: 50%;
    height: 20%;
    top: 40%;
    left: 50%;
    animation-delay: 2s;
    transition: 0.3s;
}
#dgcss-cor-amarelo {
    background: #d19f15; orange;
    transition: 0.3s;
    animation-delay: 3s;
}
.dgcss-conteudo {
    left: 0px;
    position: fixed;
    display: flex;
    width: 100vw;
    height: 100vh;
    text-align: center;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(50px);
    color: white;
    font-size: 36pt;
    font-family: 'Dongle', sans-serif;
    z-index: 1;
}
.dgcss-menu-bottom {
    width: 100%;
    background: rgba(240, 240, 255, 0.4);
    position: fixed;
    left: 0px;
    bottom: 0px;
    color: white;
    z-index: 1;
    display: flex;
    gap: 50px;
    text-align: center;
    justify-content: space-around;
    font-size: 10pt;
} 
.nav-btn {
    margin: 20px;
    display: grid;
    place-items: center;
    color: white;
    text-decoration: none;
    padding: 0% 0%;
    border-radius: 50%;
    font-weight: bolder;
}
#dgcss-title {
    width:44vw;
    white-space:nowrap ;
    overflow:hidden ;
    text-overflow: ellipsis;
    text-align: left;
}
iframe {
    border: none;
    height: 100dvh;
    width: 100vw;
    position: absolute;
    animation: oi 2s;
    z-index: 99999;
}
@keyframes oi {
    from {opacity: 0}
    to {opacity: 1}
}
@keyframes tchau {
    from {opacity: 1}
    to {opacity: 0}
}

        </style>
    </head>
    <body id="body">
    <div id="menua" class="dgcss-menu">
        <h3 id="dgcss-title">Titulo</h3>
        <div>
        <button onclick="dg_trocar()" id="tema">
            Escuro
        </button>
        </div>
    </div>
    
    <div class="dgcss-bolhas">
        <div id="dgcss-cor-azul"></div>
        <div id="dgcss-cor-verde"></div>
        <div id="dgcss-cor-amarelo"></div>
    </div>
    
    <div class="dgcss-conteudo" id="content">
    Conteudo
    </div>
        
    <nav id="menub" class="dgcss-menu-bottom">
      <a class="nav-btn" href="#" id="dgcss-prev">
          ENTRAR
      </a>
      <a class="nav-btn" href="#" id="dgcss-next">
          CHAT
      </a>
    </nav>
        
<script>
//-------- Menu Toggle -------- //
const $ = id => document.getElementById(id);
var check = true;
function dg_trocar(){
    var body = $("body");
    var amarelo = $("dgcss-cor-amarelo");
    var azul = $("dgcss-cor-azul");
    var verde = $("dgcss-cor-verde");
    var tema = $("tema");
    if(check) {
        body.style.background ="#FF55A3";
        amarelo.style.background ="orange";
        azul.style.background ="blue";
        verde.style.background ="#52fe99";
        tema.style.background ="transparent";
        tema.innerHTML ="Claro";
        tema.style.color ="white";
        check = !check;
    } else {
        body.style.background ="rgb(50 50 90)";
        amarelo.style.background ="#d19f15";
        azul.style.background ="#6c0296";
        verde.style.background ="#2269ab";
        tema.style.background ="white";
        tema.style.color ="rgb(40 40 100)";
        tema.innerHTML ="Escuro";
        check = !check;
    }
}
    
//-------- Displayer Of Contents -------- //
let prv, nxt, title, content, count, current=1;
let pages = {
  1:{t:"Entrada", c:"Seja Bem Vindo"},
  2:{t:"Entrando", c:"<iframe border=none src=https://diogocass.github.io/projetos/app/webchat.html# allowfullscreen></iframe>"}
};
count = Object.keys(pages).length;
window.onload = init;
function init(){
  prv = document.querySelector("#dgcss-prev");
  nxt = document.querySelector("#dgcss-next");
  title = document.querySelector("#dgcss-title");
  cont = document.querySelector("#content");
  prv.addEventListener("click", prevPage);
  nxt.addEventListener("click", nextPage);
  setCurrent(current);
}
function setCurrent(current){
  title.textContent = pages[current].t;
  cont.innerHTML = pages[current].c;
  prv.disabled = current<=1?true:false; 
  nxt.disabled = current>=count?true:false;
}
function prevPage(){
  current = current<=1?1:--current;
  setCurrent(current);
}
function nextPage(){
  menua.style.animation= "tchau 1s";
  menub.style.animation= "tchau 1s";
  setTimeout(()=>{
  menua.style.display= "none";
  menub.style.display= "none";
      current = current>=count?count:++current; 
      setCurrent(current);
  },1000)
}
</script>
    </body>
  </html>
