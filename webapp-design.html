<!DOCTYPE html>
<html>
  <head>
      <meta class="statusbar" name="theme-color" content="red">
      <meta property=og:image content="https://i.ibb.co/bgT84f94/DM-me-for-custom-arts-album-covers-logo-designs-tattoo-designs-book-covers-posters-product-des-ation.jpg"/>
      <link rel="shortcut icon" href="https://i.ibb.co/bgT84f94/DM-me-for-custom-arts-album-covers-logo-designs-tattoo-designs-book-covers-posters-product-des-ation.jpg" type="image/x-icon">
      <link rel="apple-touch-icon" href="https://i.ibb.co/bgT84f94/DM-me-for-custom-arts-album-covers-logo-designs-tattoo-designs-book-covers-posters-product-des-ation.jpg">
      <meta name="description" content="WebSite Design — Criado por Diogo Coutinho Cassemiro">
      <title>Layout Website Design</title>
      <meta charset="UTF-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1 maximum-scale=1">
      <link href="https://fonts.googleapis.com/css?family=Raleway:300|Roboto" rel="stylesheet">
      <style>
@import url(https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap);
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background: black; white;
    color: #333;
    font-size: 100%;
    font-family: 'Roboto', sans-serif;
}
#wrapper {
    overflow-x: hidden;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: scroll;
}
#bg-couverture {
    width: 100vw;
    height: 250px;
    background: #333;
    position: fixed;
    z-index: 60;
    top: 0; left: 0;
    background-color: red;
    background-repeat: no-repeat;
    background-size: cover;
}
#pdp {
    position: fixed;
    z-index: 99;
    width: 150px;
    height: 150px;
    border-radius: 100%;
    left: 50%; top: 250px;
    background-image: url("https://i.ibb.co/p94YpyF/DM-me-for-custom-arts-album-covers-logo-designs-tattoo-designs-book-covers-posters-product-design-ta.jpg");
    transform: translate(-50%,-50%);
    background-repeat: no-repeat;
    background-size: cover;
    background-position: right 10% bottom 70%;
}
#page {
    width: 100vw;
    /*background: white;*/
    min-height: 100vh;
    object-fit: cover;
    height: 100vh;
    margin-top: 300px;
    z-index: 55;
    padding: 80px 30px 10px 30px;
}
img {
    width: 100vw;
    position: absolute;
    top: 278px;
    left: 0;
    z-index: -44;
}
h1 {
    font-family: "Raleway";
    text-align: center;
    font-weight: bold;
    color: red;
}
.about-title { 
    position: relative; 
    /*text-transform: uppercase; */
    padding-top: 50px; 
    padding-bottom: 10px; 
    width: 250px; 
    text-align: center; 
    border-bottom: 2px solid #1c1c1c; 
    font-weight: 200; 
    margin: 0 auto 30px;
    font-size: 25px;
} 
.about-title::after { 
    content: ""; 
    position: absolute; 
    display: inline-block; 
    height: 8px; 
    width: 8px; 
    background-color: silver; 
    left:calc(50% - 10px); 
    top: calc(94% - 10px); 
    transform: rotate(45deg) translate(50%, 50%); 
    border: 3px solid #1c1c1c;
} 
.watermark{
   position:fixed;
   top:14px;
   right:20px;
   z-index:1000;
   }
.watermark-txt{
   background:rgba(255,255,255,.15);
   padding:8px 16px;
   border-radius:20px;
   font-family:Poppins,sans-serif;
   font-size:14px;
   color:rgba(0,0,0,.7);
   display:flex;
   align-items:center;
   box-shadow:0 2px 10px rgba(0,0,0,.1);
   border:1px solid rgba(255,255,255,.3);
   position:relative;
   overflow:hidden
}

      </style>
  </head>
  <body>
    <div id="wrapper">
        <div id="bg-couverture"></div>
        <div id="pdp"></div>
        <div id="page">
            <h1 class="about-title">Dg C.Cass Websites</h1> 
            <img src="https://i.ibb.co/svnKkTk0/DM-me-for-custom-arts-album-covers-logo-designs-tattoo-designs-book-covers-posters-product-design-ta.jpg">
        </div>
    </div>
    
    <div class="watermark" onclick="window.location.href='https://codiogo-css.droppages.com'">
        <div class="watermark-txt">
            🧑‍💻 Criado por DgCass
        </div>
    </div>
    
    <script>
      const wrapper = document.getElementById('wrapper');
      const bgCouverture = document.getElementById('bg-couverture');
      const pdp = document.getElementById('pdp');

      wrapper.addEventListener('scroll', function() {
          const scrollTop = wrapper.scrollTop;
          const a = 250 - scrollTop / 1.6 + 'px';
          const b = 50 - scrollTop / 7.3 + '%';
          const c = 150 - scrollTop / 3 + 'px';
          const d = 250 - scrollTop / 1.37 + 'px';

          bgCouverture.style.height = a;
          pdp.style.top = d;
          pdp.style.left = b;
          pdp.style.width = c;
          pdp.style.height = c;
      });
    </script>
  </body>
</html>
